name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Build application
        run: go build ./cmd/sports
      - name: Build Docker image
        run: docker build -t sports-data-platform:ci .