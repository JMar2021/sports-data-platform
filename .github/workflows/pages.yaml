name: Pages

on:
  push:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Configure pages
        uses: actions/configure-pages@v5
      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with: 
          path: ./site
  deploy:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4