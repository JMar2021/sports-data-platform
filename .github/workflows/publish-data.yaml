name: Publish games.json data

on:
  workflow_dispatch:


jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Run exporter
        run: docker compose run --rm export
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub pages
        uses: actions/deploy-pages@v4
